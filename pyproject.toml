[project]
name = "kourichat"
version = "1.5.0"
description = "KouriChat 1.5 dev"
requires-python = ">=3.14"
dependencies = [
    "cordis-python>=0.9.2",
    "elixir>=0.1.0",
    "loguru>=0.7",
]

[project.scripts]
kourichat = "kourichat.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kourichat"]

[tool.uv.sources]
elixir = { path = "elixir-0.1.0-py3-none-any.whl" }
